[project]
name = "bmad-crew"
version = "1.0.0"
description = "The BMAD software-delivery crew rebuilt in CrewAI, instrumented with OpenTelemetry."
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pin to the tutorial baseline; CrewAI moves fast — see TUTORIAL.md before bumping.
    "crewai==1.15.1",
    # [mcp] extra pulls the MCP client so agents can use the GitHub MCP server
    # (optional GitHub tools — see bmad-crew/GITHUB_TOOLS.md).
    "crewai-tools[mcp]>=0.30.0",
    # HTTP service for the k8s deployment.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Path A: OpenLIT auto-instrumentation (default, gen_ai.* spans + GenAI metrics).
    # Switched at runtime via CREWAI_INSTRUMENTATION=openlit (the default).
    "openlit>=1.33.0",
]

[project.optional-dependencies]
# Path B: OpenLLMetry (Traceloop) auto-instrumentation.
# Install: pip install bmad-crew[openllmetry]
# Enable:  CREWAI_INSTRUMENTATION=openllmetry
openllmetry = [
    "traceloop-sdk>=0.38.0",
]

# Path C: Native CrewAI event-bus → OTel SDK listener.
# Install: pip install bmad-crew[native]
# Enable:  CREWAI_INSTRUMENTATION=native
native = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

# All three paths in one image — use this for the demo Docker image so that
# CREWAI_INSTRUMENTATION can be toggled at runtime without a rebuild.
# Install: pip install bmad-crew[all-observability]
all-observability = [
    "traceloop-sdk>=0.38.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[project.scripts]
bmad-crew = "bmad_crew.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_crew"]
