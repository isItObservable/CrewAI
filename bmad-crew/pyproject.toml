[project]
name = "bmad-crew"
version = "1.0.0"
description = "The BMAD software-delivery crew rebuilt in CrewAI, instrumented with OpenTelemetry."
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pin to the tutorial baseline; CrewAI moves fast — see TUTORIAL.md before bumping.
    "crewai==1.15.1",
    # [mcp] extra pulls the MCP client so agents can use the GitHub MCP server
    # (optional GitHub tools — see bmad-crew/GITHUB_TOOLS.md).
    "crewai-tools[mcp]>=0.30.0",
    # HTTP service for the k8s deployment.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # CopilotKit BFF (copilotkit_bff.py) calls the crew service over HTTP.
    "httpx>=0.27",
    # OpenTelemetry via OpenLIT (gen_ai.* spans + GenAI metrics, OTLP-native).
    "openlit>=1.33.0",
]

[project.scripts]
bmad-crew = "bmad_crew.main:main"
bmad-crew-bff = "bmad_crew.copilotkit_bff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_crew"]
