apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bmad-crew
  namespace: bmad-crew
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bmad-crew
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Illustrative: the real bottleneck is usually the LLM backend, not pod CPU.
          averageUtilization: 70
