# STARTER OTel Collector for the BMAD crew — app-shape reference for the Observability
# Agent (ISI-1586), who owns the production collector + Dynatrace dashboards.
#
# Because the app uses OpenLIT (gen_ai.* spans + GenAI metrics, OTLP-native), NO
# attribute transform is required — signals land in Dynatrace's native GenAI model
# directly. If you instead use OpenInference, add the OI->gen_ai `transform` processor
# from research ISI-1584 §4 Option 2.
#
# Pipeline order respects our house rules: memory_limiter FIRST, batch LAST,
# k8sattributes added because we run on Kubernetes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      k8sattributes: {}
      batch: {}
    exporters:
      otlphttp/dynatrace:
        # Provided by the Observability Agent (ISI-1586) — Dynatrace tenant oat05854.
        endpoint: ${env:DT_OTLP_ENDPOINT}      # e.g. https://oat05854.live.dynatrace.com/api/v2/otlp
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/dynatrace]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/dynatrace]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/dynatrace]
