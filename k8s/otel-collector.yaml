# OpenTelemetry Collector — managed by the OpenTelemetry Operator
#
# Deploys a gateway-mode Deployment that:
#   - Receives OTLP/gRPC (4317) and OTLP/HTTP (4318) from the bmad-crew pods
#   - Enriches spans/metrics/logs with K8s pod metadata (k8sattributes)
#   - Exports to Dynatrace via OTLP HTTP (otlphttp exporter)
#   - Tees a copy to the debug exporter (visible in collector pod logs)
#
# Prerequisites:
#   1. OpenTelemetry Operator installed in the cluster.
#   2. A secret named "dynatrace-otlp" in the observability namespace with:
#        DT_ENDPOINT  — Dynatrace tenant base URL
#                       e.g. https://<tenant-id>.live.dynatrace.com
#                       or   https://<tenant-id>.dev.dynatracelabs.com
#        DT_API_TOKEN — Dynatrace API token with Ingest metrics/traces/logs scopes
#
# Apply:
#   kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f k8s/otel-collector.yaml
#
# Create / update the secret (never commit real tokens):
#   kubectl create secret generic dynatrace-otlp -n observability \
#     --from-literal=DT_ENDPOINT=https://<tenant-id>.live.dynatrace.com \
#     --from-literal=DT_API_TOKEN=dt0c01.XXXX \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  replicas: 1

  # Inject Dynatrace credentials from the secret as environment variables.
  envFrom:
    - secretRef:
        name: dynatrace-otlp

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      k8sattributes: {}
      batch: {}

    exporters:
      otlphttp:
        endpoint: ${DT_ENDPOINT}/api/v2/otlp
        headers:
          Authorization: "Api-Token ${DT_API_TOKEN}"
      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp, debug]
