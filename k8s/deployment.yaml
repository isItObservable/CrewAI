apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmad-crew
  namespace: bmad-crew
  labels:
    app.kubernetes.io/name: bmad-crew
    app.kubernetes.io/part-of: isitobservable-crewai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bmad-crew
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bmad-crew
    spec:
      containers:
        - name: bmad-crew
          # Replace with your registry/tag once built & pushed (see TUTORIAL.md §6).
          image: ghcr.io/isitobservable/bmad-crew:sha-e0fea31
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: bmad-crew-config
            - secretRef:
                name: bmad-crew-secrets
          resources:
            # The pod is light — the LLM inference is remote (Ollama). Raise if you run
            # in-cluster inference or enable heavy memory/RAG.
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: memory
              mountPath: /app/.crewai
            # agents.yaml and tasks.yaml are served from the ConfigMap so you can
            # retune any agent's role/goal/backstory without rebuilding the image —
            # just edit the ConfigMap and run `kubectl rollout restart`.
            - name: crew-config
              mountPath: /app/src/bmad_crew/config/agents.yaml
              subPath: agents.yaml
            - name: crew-config
              mountPath: /app/src/bmad_crew/config/tasks.yaml
              subPath: tasks.yaml
      volumes:
        - name: memory
          persistentVolumeClaim:
            claimName: bmad-crew-memory
        - name: crew-config
          configMap:
            name: bmad-crew-config
