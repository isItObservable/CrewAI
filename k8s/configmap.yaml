apiVersion: v1
kind: ConfigMap
metadata:
  name: bmad-crew-config
  namespace: bmad-crew
data:
  # Local qwen via Ollama — no external key, just a base URL (the episode differentiator).
  MODEL: "ollama/qwen3.6"
  OLLAMA_BASE_URL: "http://<your-ollama-host>:11434"
  MODEL_TEMPERATURE: "0.4"
  # OTel: send to the in-cluster Collector gateway.
  # 4318 = OTLP/HTTP. This is the collector Service DNS we validated live
  # (observability namespace gateway). Substitute your own collector's DNS.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-gateway-collector.observability.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "bmad-crew"
  OTEL_ENVIRONMENT: "observable-crewai"
  CREWAI_DISABLE_TELEMETRY: "true"
  # Instrumentation path — toggle without rebuilding the image:
  #   openlit      (default) OpenLIT gen_ai.* spans + GenAI metrics
  #   openllmetry  Traceloop auto-instrumentation
  #   native       Native CrewAI event-bus → OTel SDK listener
  CREWAI_INSTRUMENTATION: "openlit"
  # Human-in-the-loop: set to "false" for fully automated server mode.
  # The CLI default is "true" (interactive checkpoints at requirements / arch / QA).
  BMAD_HUMAN_IN_LOOP: "false"
  # GitHub MCP transport for the dev agent:
  #   remote  — GitHub's hosted MCP endpoint (no Docker, PAT sent as bearer token)
  #   docker  — local github-mcp-server container (needs Docker socket in pod)
  GITHUB_MCP_MODE: "remote"
