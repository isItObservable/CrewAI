apiVersion: v1
kind: Secret
metadata:
  name: bmad-crew-secrets
  namespace: bmad-crew
type: Opaque
stringData:
  # Our tutorial runs against LOCAL Ollama, so no LLM key is required — this Secret is
  # a placeholder showing where a hosted-provider key (OpenAI/Anthropic/…) would go if
  # you swap the model. Leave empty for the local-qwen path.
  OPENAI_API_KEY: ""
  # If you later point OTLP at a vendor endpoint that needs an ingest token, put it here
  # and reference it from the Deployment (the local Collector gateway does not need one).
  # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Api-Token dt0c01.XXXX"
