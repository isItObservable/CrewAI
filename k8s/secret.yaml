apiVersion: v1
kind: Secret
metadata:
  name: bmad-crew-secrets
  namespace: bmad-crew
type: Opaque
stringData:
  # ── LLM key (optional) ────────────────────────────────────────────────────
  # Local Ollama/qwen is key-free. Only needed if you switch COPILOTKIT_ADAPTER
  # to openai or anthropic.
  OPENAI_API_KEY: ""

  # ── GitHub PAT for the dev agent (sympozium-todo-demo demo) ───────────────
  # DO NOT commit a real token here. Apply it directly:
  #
  #   kubectl patch secret bmad-crew-secrets -n bmad-crew \
  #     --type merge \
  #     -p '{"stringData":{"GITHUB_PERSONAL_ACCESS_TOKEN":"ghp_YOUR_TOKEN"}}'
  #
  # Fine-grained PAT scopes needed (repo: sympozium-todo-demo only):
  #   Contents:       Read & Write  (create branch, commit files)
  #   Pull requests:  Read & Write  (open PR)
  #   Metadata:       Read (required)
  #
  # Leave empty to run without GitHub MCP — dev agent writes to ./output/ instead.
  GITHUB_PERSONAL_ACCESS_TOKEN: ""

  # ── OTel ingest token (optional) ─────────────────────────────────────────
  # Only needed if you point OTLP directly at a vendor endpoint.
  # The local Collector gateway does not need a token.
  # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Api-Token dt0c01.XXXX"
