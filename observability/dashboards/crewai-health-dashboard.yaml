  tiles:
    '0':
      content: '# 🩺 CrewAI — Health & Availability

        Component, operator & agent health for the **observable-crewai** cluster:
        Kubernetes workload state (DynaKube), agent-service RED metrics, agent-run
        success & logs.'
      type: markdown
    '1':
      content: '## Overview'
      type: markdown
    '10':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries mem = avg(dt.kubernetes.container.memory_working_set), by:{k8s.workload.name},
        filter:{ k8s.namespace.name == "bmad-crew" }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Container Memory Working Set by Workload
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '11':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries thr = avg(dt.kubernetes.container.cpu_throttled), by:{k8s.workload.name},
        filter:{ k8s.namespace.name == "bmad-crew" }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: CPU Throttling by Workload
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '12':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries rx = avg(dt.kubernetes.pod.network_received_data), tx = avg(dt.kubernetes.pod.network_transmitted_data),
        filter:{ k8s.namespace.name == "bmad-crew" }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Pod Network I/O
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '13':
      content: '## Agent Service Health (RED)'
      type: markdown
    '14':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries req = sum(dt.service.request.count), by:{dt.entity.service},
        filter:{ k8s.namespace.name == "bmad-crew" }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Request Throughput by Agent Service
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '15':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries fail = sum(dt.service.request.failure_count), by:{dt.entity.service},
        filter:{ k8s.namespace.name == "bmad-crew" }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Failures by Agent Service
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '16':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: timeseries rt = avg(dt.service.request.response_time), by:{dt.entity.service},
        filter:{ k8s.namespace.name == "bmad-crew" }
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Response Time by Agent Service
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '17':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and startsWith(span.name, "invoke_agent
        ")

        | filter contains(span.name, "(")

        | summarize runs = count(), failed = countIf(span.status_code == "ERROR"),
        by:{span.name}

        | sort runs desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Agent Run Success
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    '18':
      content: '## Logs & Errors'
      type: markdown
    '19':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch logs

        | filter k8s.namespace.name == "bmad-crew"

        | makeTimeseries logs = count(), by:{k8s.deployment.name}'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Log Volume by Component
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '2':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and startsWith(span.name, "invoke_agent
        ")

        | filter contains(span.name, "(")

        | summarize Agents = countDistinct(span.name)'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Active Agents
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: agents seen
          recordField: Agents
          sparklineSettings:
            isVisible: false
          trend:
            isVisible: false
    '20':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch logs

        | filter k8s.namespace.name == "bmad-crew"

        | summarize logs = count(), errors = countIf(loglevel == "ERROR" or status
        == "ERROR"), by:{component = k8s.deployment.name}

        | sort errors desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Log Errors by Component
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    '21':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        fetch logs
        | filter k8s.namespace.name == "bmad-crew" and isNotNull(gen_ai.operation.name)
        | sort timestamp desc
        | limit 50
        | fieldsAdd outputRaw = gen_ai.output.messages[0], inputRaw = gen_ai.input.messages[-1]
        | parse outputRaw, "JSON:outParsed"
        | parse inputRaw, "JSON:inParsed"
        | fieldsAdd outputText = outParsed[parts][0][content], inputText = inParsed[parts][0][content],
                   finishReason = gen_ai.response.finish_reasons[0],
                   toolname = outParsed[parts][0][name], response = inParsed[parts][0][response]
        | fields timestamp, inTok = gen_ai.usage.input_tokens, outTok = gen_ai.usage.output_tokens, finishReason, inputText, outputText, toolname, response
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: GenAI Event Log
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    '22':
      content: '## Engine & Run Health (span-derived) additions

        CrewAI emits **no OTLP metrics**, so these engine-liveness & run-quality panels
        are derived from `gen_ai.*` / A2A spans.'
      type: markdown
    '23':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and startsWith(span.name, "invoke_agent
        ")

        | filter contains(span.name, "(")

        | summarize p50 = percentile(duration, 50) / 1000000000.0'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Run Latency p50 (s)
      type: data
      visualization: singleValue
      visualizationSettings:
