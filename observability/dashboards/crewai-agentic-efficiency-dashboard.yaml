      query: 'fetch spans

        | filter contains(service.name, "bmad") and span.name == "openai.chat"

        | summarize input = sum(coalesce(toLong(`gen_ai.usage.input_tokens`), toLong(`gen_ai.usage.prompt_tokens`))),
        output = sum(coalesce(toLong(`gen_ai.usage.output_tokens`), toLong(`gen_ai.usage.completion_tokens`)))

        | fieldsAdd i = record(type = "input", tokens = input), o = record(type =
