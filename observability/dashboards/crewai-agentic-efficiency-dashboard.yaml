    '28':
      content: '### Delegation / A2A hops

        No cross-agent delegation hop was emitted in the captured single-agent runs
        (consistent with local qwen3.6 rarely emits `delegate_to_persona`). **When
        delegation happens** it appears as an `execute_tool` span for the transfer
        tool + a client `POST` to the child agent’s A2A task endpoint + the child’s
        own `invoke_agent <child>` subtree on a linked trace. Build delegation panels
        on `invoke_agent` spans grouped by `gen_ai.agent.name` + trace linkage — there
        is no dedicated delegation metric.'
      type: markdown
    '29':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        fetch logs
        | filter k8s.namespace.name == "bmad-crew" and isNotNull(gen_ai.operation.name)
        | sort timestamp desc
        | limit 100
        | fieldsAdd outputRaw = gen_ai.output.messages[0], inputRaw = gen_ai.input.messages[-1]
        | parse outputRaw, "JSON:outParsed"
        | parse inputRaw, "JSON:inParsed"
        | fieldsAdd outputText = outParsed[parts][0][content], inputText = inParsed[parts][0][content],
                   finishReason = gen_ai.response.finish_reasons[0],
                   toolname = outParsed[parts][0][name], response = inParsed[parts][0][response]
        | fields timestamp, trace_id, inTok = gen_ai.usage.input_tokens, outTok = gen_ai.usage.output_tokens, finishReason, inputText, outputText, toolname, response
      querySettings:
