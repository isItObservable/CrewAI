    '17':
      content: '## Per-Agent Breakdown'
      type: markdown
    '18':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and startsWith(span.name, "invoke_agent
        ")

        | filter contains(span.name, "(")

        | summarize runs = count(), failed = countIf(span.status_code == "ERROR"),
        avgDurationS = avg(duration) / 1000000000.0, p90DurationS = percentile(duration,
        90) / 1000000000.0, by:{span.name}

        | sort avgDurationS desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Per-Agent Efficiency
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    '19':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        fetch logs
        | filter k8s.namespace.name == "bmad-crew" and isNotNull(gen_ai.operation.name)
        | sort timestamp desc
        | limit 50
        | fieldsAdd outputRaw = gen_ai.output.messages[0], inputRaw = gen_ai.input.messages[-1]
        | parse outputRaw, "JSON:outParsed"
        | parse inputRaw, "JSON:inParsed"
        | fieldsAdd outputText = outParsed[parts][0][content], inputText = inParsed[parts][0][content],
                   finishReason = gen_ai.response.finish_reasons[0],
                   toolname = outParsed[parts][0][name], response = inParsed[parts][0][response]
        | fields timestamp, inTok = gen_ai.usage.input_tokens, outTok = gen_ai.usage.output_tokens, finishReason, inputText, outputText, toolname, response
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Live Agentic Event Feed
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    '2':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and span.name == "openai.chat"

        | summarize Tokens = sum(coalesce(toLong(`gen_ai.usage.input_tokens`), toLong(`gen_ai.usage.prompt_tokens`)))'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Input Tokens
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: input tokens
          recordField: Tokens
          sparklineSettings:
            isVisible: false
          trend:
            isVisible: false
    '20':
      content: '## Efficiency KPIs & Tool Quality additions

        Cost/throughput KPIs and tool reliability derived from spans. Signals: tokens-per-run,
        tool latency & `isError` rate, run/LLM latency percentiles, finish reasons,
        MCP-vs-builtin tool split.'
      type: markdown
    '21':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and (span.name == "openai.chat"
        or (startsWith(span.name, "invoke_agent ") and contains(span.name, "(")))

        | summarize tok = sum(coalesce(toLong(`gen_ai.usage.input_tokens`), toLong(`gen_ai.usage.prompt_tokens`)))
        + sum(coalesce(toLong(`gen_ai.usage.output_tokens`), toLong(`gen_ai.usage.completion_tokens`))),
        runs = countIf(startsWith(span.name, "invoke_agent ") and contains(span.name,
        "("))

        | fieldsAdd TokensPerRun = if(runs > 0, toDouble(tok) / runs, else: 0.0)

        | fields TokensPerRun'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Avg Tokens / Run
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: input+output / invoke_agent
          recordField: TokensPerRun
          sparklineSettings:
            isVisible: false
          trend:
            isVisible: false
    '22':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and startsWith(span.name, "execute_tool
        ")

        | summarize total = count(), errors = countIf(span.status_code == "ERROR")

        | fieldsAdd ErrPct = if(total > 0, toDouble(errors) / total * 100, else: 0.0)

        | fields ErrPct'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Tool Error Rate (%)
      type: data
