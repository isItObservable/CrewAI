  tiles:
    '0':
      content: '# 🤖 CrewAI — Agentic Efficiency

        Token economics, LLM calls & tool invocations for the **observable-crewai**
        CrewAI crew (self-hosted qwen3.6 on the Mac Studio). Signals: `gen_ai.usage.*`,
        `gen_ai.operation.name`, `gen_ai.tool.name` — OTLP spans → Dynatrace.'
      type: markdown
    '1':
      content: '## Overview'
      type: markdown
    '10':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and startsWith(span.name, "invoke_agent
        ")

        | filter contains(span.name, "(")

        | summarize runs = count(), avgDurationS = avg(duration) / 1000000000.0, by:{span.name}

        | sort avgDurationS desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Total Tokens by Agent
      type: data
      visualization: categoricalBarChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '11':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and span.name == "openai.chat"

        | summarize tokens = sum(coalesce(toLong(`gen_ai.usage.input_tokens`), toLong(`gen_ai.usage.prompt_tokens`)))
        + sum(coalesce(toLong(`gen_ai.usage.output_tokens`), toLong(`gen_ai.usage.completion_tokens`))),
        by:{model = coalesce(`gen_ai.request.model`, `gen_ai.response.model`)}

        | sort tokens desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Tokens by Model
      type: data
      visualization: pieChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: right
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '12':
      content: '## LLM & Tool Activity'
      type: markdown
    '13':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad")

        | filter span.name == "openai.chat" or startsWith(span.name, "invoke_agent
        ") or startsWith(span.name, "execute_tool ") or startsWith(span.name, "invoke_workflow")

        | fieldsAdd opType = if(span.name == "openai.chat", "chat", else: if(startsWith(span.name,
        "execute_tool "), "execute_tool", else: if(startsWith(span.name, "invoke_workflow"),
        "invoke_workflow", else: "invoke_agent")))

        | makeTimeseries ops = count(), by:{opType}'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Agent Operations Over Time
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '14':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch spans

        | filter contains(service.name, "bmad") and span.name == "openai.chat"

        | summarize avgMs = avg(duration) / 1000000.0, p90Ms = percentile(duration,
        90) / 1000000.0, calls = count(), by:{model = coalesce(gen_ai.request.model,
        gen_ai.response.model)}

        | sort avgMs desc'
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Avg LLM Latency by Agent (ms)
      type: data
      visualization: categoricalBarChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
        coloring:
          colorRules:
          - colorMode: color-palette
            colorPalette: purple-rain
            comparator: = *value*
            field: DT.name
            type: string
            value: ''
    '15':
