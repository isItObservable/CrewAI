# Standalone OpenTelemetry Collector for the CrewAI BMAD-crew episode cluster.
# Receives OTLP (traces + metrics + logs) from the CrewAI service and exports to
# Dynatrace oat05854 (/api/v2/otlp). ISI-1586 (child of ISI-1582), consistent
# with the kagent/Sympozium episodes.
#
# The CrewAI app -> collector hop is header-less gRPC/HTTP; the collector injects
# the Dynatrace Api-Token so the app never holds the DT credential.
# Requires Secret `dynatrace` in ns `crewai`:
#   dynatrace_oltp_url  (e.g. https://oat05854.live.dynatrace.com)
#   dt_api_token        (Api-Token with openTelemetryTrace.ingest, metrics.ingest, logs.ingest)
#
# Deploy:
#   kubectl create ns crewai
#   kubectl -n crewai create secret generic dynatrace \
#     --from-literal=dynatrace_oltp_url=https://oat05854.live.dynatrace.com \
#     --from-literal=dt_api_token=dt0c01.XXXX
#   kubectl apply -f otel-collector.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcontribcol
  namespace: crewai
  labels: { app: otelcontribcol }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otelcontribcol-crewai
  labels: { app: otelcontribcol }
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events","namespaces","namespaces/status","nodes","nodes/spec","nodes/stats","nodes/proxy","pods","pods/status","replicationcontrollers","replicationcontrollers/status","resourcequotas","services","endpoints"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets","deployments","replicasets","statefulsets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets","deployments","replicasets"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otelcontribcol-crewai
  labels: { app: otelcontribcol }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otelcontribcol-crewai
subjects:
  - kind: ServiceAccount
    name: otelcontribcol
    namespace: crewai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: crewai
  labels: { app: otel-collector }
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # RULE: memory_limiter MUST be the first processor in every pipeline.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 70
        spike_limit_percentage: 30
      # RULE: k8sattributes ONLY in Kubernetes (this manifest). Never in the
      # standalone/VM config.
      k8sattributes:
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.cluster.uid
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.name }, { from: resource_attribute, name: k8s.namespace.name }]
          - sources: [{ from: resource_attribute, name: k8s.pod.ip }]
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: connection }]
      resource:
        attributes:
          - { action: insert, key: k8s.cluster.name, value: observable-crewai }
      # Dynatrace topology enrichment. Also normalizes OpenInference token
      # attributes to gen_ai.* so dashboards work regardless of which
      # instrumentation path the user chose (native listener vs OpenInference).
      transform:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["dt.kubernetes.workload.kind"], "deployment") where IsString(attributes["k8s.deployment.name"])
              - set(attributes["dt.kubernetes.workload.name"], attributes["k8s.deployment.name"]) where IsString(attributes["k8s.deployment.name"])
              - set(attributes["dt.kubernetes.workload.kind"], "statefulset") where IsString(attributes["k8s.statefulset.name"])
              - set(attributes["dt.kubernetes.workload.name"], attributes["k8s.statefulset.name"]) where IsString(attributes["k8s.statefulset.name"])
              - set(attributes["dt.kubernetes.cluster.id"], attributes["k8s.cluster.uid"]) where IsString(attributes["k8s.cluster.uid"])
          - context: span
            statements:
              # OpenInference -> OTel GenAI semconv fallback (no-op for the native listener).
              - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["llm.token_count.prompt"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["llm.token_count.completion"] != nil
              - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["gen_ai.request.model"] == nil and attributes["llm.model_name"] != nil
        log_statements:
          - context: resource
            statements:
              - set(attributes["dt.kubernetes.workload.kind"], "deployment") where IsString(attributes["k8s.deployment.name"])
              - set(attributes["dt.kubernetes.workload.name"], attributes["k8s.deployment.name"]) where IsString(attributes["k8s.deployment.name"])
              - set(attributes["dt.kubernetes.cluster.id"], attributes["k8s.cluster.uid"]) where IsString(attributes["k8s.cluster.uid"])
        metric_statements:
          - context: resource
            statements:
              - set(attributes["dt.kubernetes.cluster.id"], attributes["k8s.cluster.uid"]) where IsString(attributes["k8s.cluster.uid"])
      cumulativetodelta: {}
      # RULE: batch MUST be the last processor in every pipeline.
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 30s
    exporters:
      debug: { verbosity: normal }
      otlphttp:
        endpoint: ${DT_ENDPOINT}/api/v2/otlp
        headers:
          Authorization: Api-Token ${DT_API_TOKEN}
    service:
      telemetry:
        metrics:
          readers:
            - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, transform, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, transform, batch]
          exporters: [otlphttp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, transform, cumulativetodelta, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: crewai
  labels: { app: otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      serviceAccountName: otelcontribcol
      containers:
        - name: otc
          image: otel/opentelemetry-collector-contrib:0.154.0
          args: ["--config=/conf/collector.yaml"]
          env:
            - name: DT_ENDPOINT
              valueFrom: { secretKeyRef: { name: dynatrace, key: dynatrace_oltp_url } }
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dynatrace, key: dt_api_token } }
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 8888, name: self-metrics }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
      volumes:
        - name: conf
          configMap: { name: otel-collector-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: crewai
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
