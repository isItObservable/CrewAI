# OpenTelemetry Gateway Collector — managed by the OTel Operator
#
# Receives OTLP from the BMAD-crew pods (traces + metrics + logs) and exports
# to Dynatrace via OTLP/HTTP.  The Collector injects the Dynatrace auth header
# so the application pods never hold the credential.
#
# Prerequisites (see TUTORIAL.md §8.2):
#   - cert-manager installed
#   - opentelemetry-operator installed (Helm chart open-telemetry/opentelemetry-operator)
#   - Secret `dynatrace-otlp` created in namespace `observability`:
#       kubectl create secret generic dynatrace-otlp -n observability \
#         --from-literal=endpoint="https://<tenant>.live.dynatrace.com" \
#         --from-literal=token="Api-Token dt0c01.XXXX"
#
# Deploy:
#   kubectl apply -f observability/collector/k8s/otel-gateway.yaml
#   kubectl -n observability rollout status deploy/otel-gateway-collector
#
# The crew ConfigMap must point OTEL_EXPORTER_OTLP_ENDPOINT to:
#   http://otel-gateway-collector.observability.svc.cluster.local:4318
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  image: otel/opentelemetry-collector-k8s:0.156.0
  mode: deployment
  replicas: 1
  env:
    - name: DT_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: dynatrace-otlp
          key: endpoint
    - name: DT_AUTH
      valueFrom:
        secretKeyRef:
          name: dynatrace-otlp
          key: token
  observability:
    metrics:
      enableMetrics: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      resource:
        attributes:
          - action: upsert
            key: deployment.environment
            value: production

      # Normalize OpenInference / OpenLLMetry / Traceloop attribute names to the
      # canonical OTel GenAI semconv (gen_ai.*).  No-op when OpenLIT is used
      # directly (it already emits gen_ai.* natively).
      transform/genai-normalize:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # OpenInference (Arize) → gen_ai.*
              - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["llm.token_count.prompt"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["llm.token_count.completion"] != nil
              - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["gen_ai.request.model"] == nil and attributes["llm.model_name"] != nil
              # OpenLLMetry (Traceloop) → gen_ai.*
              - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.prompt_tokens"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["gen_ai.usage.prompt_tokens"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.completion_tokens"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["gen_ai.usage.completion_tokens"] != nil
              - set(attributes["gen_ai.agent.name"], attributes["traceloop.entity.name"]) where attributes["gen_ai.agent.name"] == nil and attributes["traceloop.span.kind"] == "agent"
              - set(attributes["gen_ai.operation.name"], "execute_tool") where attributes["gen_ai.operation.name"] == nil and attributes["traceloop.span.kind"] == "tool"
              - set(attributes["gen_ai.tool.name"], attributes["traceloop.entity.name"]) where attributes["gen_ai.tool.name"] == nil and attributes["traceloop.span.kind"] == "tool"

      cumulativetodelta: {}

      batch:
        send_batch_size: 8192
        send_batch_max_size: 16384
        timeout: 5s

    exporters:
      otlphttp/dynatrace:
        endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
        headers:
          Authorization: ${env:DT_AUTH}
        tls:
          insecure: false
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, transform/genai-normalize, batch]
          exporters: [otlphttp/dynatrace]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/dynatrace]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, cumulativetodelta, batch]
          exporters: [otlphttp/dynatrace]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
