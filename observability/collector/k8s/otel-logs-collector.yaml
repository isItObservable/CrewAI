# OpenTelemetry Log Collector — DaemonSet, managed by the OTel Operator
#
# One pod per node.  Tails container log files directly from the node's
# /var/log/pods directory, parses the CRI-O / containerd / Docker format,
# enriches records with Kubernetes metadata (k8sattributes), batches, and
# exports to Dynatrace via OTLP/HTTP.
#
# This collector handles node-level log collection.  Application-side OTLP
# logs (emitted by the crew pods) are handled by the otel-gateway Deployment.
#
# Prerequisites:
#   - cert-manager + opentelemetry-operator installed (see TUTORIAL.md §8.2)
#   - Secret `dynatrace-otlp` exists in namespace `observability`
#       (created in §8.2 alongside the gateway collector)
#
# Deploy:
#   kubectl apply -f observability/collector/k8s/otel-logs-collector.yaml
#   kubectl -n observability rollout status daemonset/otel-logs-collector-collector
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-logs-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-logs-collector
spec:
  image: otel/opentelemetry-collector-k8s:0.156.0
  mode: daemonset
  env:
    - name: DT_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: dynatrace-otlp
          key: endpoint
    - name: DT_AUTH
      valueFrom:
        secretKeyRef:
          name: dynatrace-otlp
          key: token
    # Restrict k8sattributes to only look up pods scheduled on this node,
    # reducing API-server load.
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlogcontainers
      mountPath: /var/log/containers
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlogcontainers
      hostPath:
        path: /var/log/containers
  config:
    receivers:
      filelog:
        # Watch all container logs on the node.
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
        include_file_path: true
        include_file_name: false
        operators:
          # ── Step 1: detect log format ────────────────────────────────────────
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-crio
                expr: 'body matches "^[^ Z]+ "'
              - output: parser-containerd
                expr: 'body matches "^[^ Z]+Z"'

          # ── Step 2a: CRI-O  →  time stream logtag log ────────────────────────
          - type: regex_parser
            id: parser-crio
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'

          # ── Step 2b: containerd  →  timeZ stream logtag log ──────────────────
          - type: regex_parser
            id: parser-containerd
            regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'

          # ── Step 2c: Docker JSON  →  {"log":…,"stream":…,"time":…} ──────────
          - type: json_parser
            id: parser-docker
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'

          # ── Step 3: extract pod metadata from the file path ───────────────────
          # Path format: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
          - type: regex_parser
            id: extract-metadata-from-filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]{36})\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
            cache:
              size: 128

          # ── Step 4: normalise fields ──────────────────────────────────────────
          - type: move
            from: attributes.log
            to: body
          - type: remove
            field: attributes.time
          - type: move
            from: attributes.stream
            to: attributes["log.iostream"]
          - type: move
            from: attributes.container_name
            to: resource["k8s.container.name"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.pod_name
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.uid
            to: resource["k8s.pod.uid"]
          - type: move
            from: attributes.restart_count
            to: resource["k8s.container.restart_count"]

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      k8sattributes:
        auth_type: serviceAccount
        # Only look up pods on the same node (uses KUBE_NODE_NAME env var).
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name

      resource:
        attributes:
          - action: upsert
            key: deployment.environment
            value: production

      batch:
        send_batch_size: 8192
        send_batch_max_size: 16384
        timeout: 5s

    exporters:
      otlphttp/dynatrace:
        endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
        headers:
          Authorization: ${env:DT_AUTH}
        tls:
          insecure: false
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/dynatrace]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
