# Copy to secret.yaml, fill in real values, and DO NOT commit the filled copy.
# Dynatrace OTLP ingest token needs scopes:
#   openTelemetryTrace.ingest, metrics.ingest, logs.ingest
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-otlp
  namespace: observability
type: Opaque
stringData:
  endpoint: "https://<your-tenant>.live.dynatrace.com/api/v2/otlp"
  api-token: "dt0c01.REPLACE_ME"
