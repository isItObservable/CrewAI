# Standalone OpenTelemetry Collector config for LOCAL / Docker Compose runs of the
# CrewAI BMAD crew (no Kubernetes). Routes OTLP -> Dynatrace <your-tenant>.
#
# RULE: no k8sattributes / no resourcedetection(k8s) here — this is the non-k8s
# path. memory_limiter is first, batch is last.
#
# Run:
#   docker run --rm -p 4317:4317 -p 4318:4318 \
#     -e DT_ENDPOINT=https://<your-tenant>.live.dynatrace.com \
#     -e DT_API_TOKEN=dt0c01.XXXX \
#     -v $(pwd)/otel-collector-config.yaml:/conf/collector.yaml \
#     otel/opentelemetry-collector-contrib:0.154.0 --config=/conf/collector.yaml
#
# Point the crew at it:  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:            # MUST be first
    check_interval: 1s
    limit_percentage: 70
    spike_limit_percentage: 30
  resource:
    attributes:
      - { action: insert, key: deployment.environment, value: demo }
  transform:                 # normalize alt instrumentations -> canonical gen_ai.* (no-op for OpenLIT / native listener)
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # OpenInference (Arize) -> OTel GenAI semconv.
          - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["llm.token_count.prompt"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["llm.token_count.completion"] != nil
          - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["gen_ai.request.model"] == nil and attributes["llm.model_name"] != nil
          # OpenLLMetry (Traceloop) -> canonical. Tokens are prompt/completion; framework
          # spans use traceloop.span.kind + traceloop.entity.name instead of gen_ai.*.
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.prompt_tokens"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["gen_ai.usage.prompt_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.completion_tokens"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["gen_ai.usage.completion_tokens"] != nil
          - set(attributes["gen_ai.agent.name"], attributes["traceloop.entity.name"]) where attributes["gen_ai.agent.name"] == nil and attributes["traceloop.span.kind"] == "agent"
          - set(attributes["gen_ai.operation.name"], "execute_tool") where attributes["gen_ai.operation.name"] == nil and attributes["traceloop.span.kind"] == "tool"
          - set(attributes["gen_ai.tool.name"], attributes["traceloop.entity.name"]) where attributes["gen_ai.tool.name"] == nil and attributes["traceloop.span.kind"] == "tool"
          # OPT-IN (OpenLLMetry path only): the shipped dashboards filter
          # gen_ai.system == "crewai", but OpenLLMetry stamps the LLM vendor there.
          # Uncomment to reuse the dashboards verbatim on the OpenLLMetry path — it
          # marks Traceloop-sourced spans as crewai; the vendor stays in gen_ai.request.model.
          # - set(attributes["gen_ai.system"], "crewai") where attributes["traceloop.workflow.name"] != nil or attributes["gen_ai.usage.prompt_tokens"] != nil
  cumulativetodelta: {}
  batch:                     # MUST be last
    send_batch_size: 800
    send_batch_max_size: 1000
    timeout: 10s

exporters:
  debug: { verbosity: normal }
  otlphttp:
    endpoint: ${DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: Api-Token ${DT_API_TOKEN}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, cumulativetodelta, batch]
      exporters: [otlphttp]
